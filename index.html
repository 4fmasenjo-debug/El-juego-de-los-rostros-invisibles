<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El juego de los rostros invisibles</title>

    <!-- FACE-API.JS -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <!-- TU JAVASCRIPT -->
    <script src="./script.js" defer></script>

    <style>
        #overlay-elements {
            position: relative;
        }

        #video {
            display: block;
        }

        #overlay-elements canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #overlay-elements img {
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="overlay-elements">
        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>
    </div>

</body>
</html>
