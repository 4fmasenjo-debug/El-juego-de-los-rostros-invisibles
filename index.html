<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El juego de los rostros invisibles</title>


    <style>

        body {

            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            background-color: #f0f0f0;

        }


        .container {

            position: relative;

            width: 768px;
            height: 576px;

        }


        #video {

            position: absolute;

            top: 0;
            left: 0;

            width: 768px;
            height: 576px;

            display: block;

        }


        #overlay-elements {

            position: absolute;

            top: 0;
            left: 0;

            width: 768px;
            height: 576px;

            pointer-events: none;

        }


        #overlay-elements canvas {

            position: absolute;

            top: 0;
            left: 0;

        }


        #overlay-elements img {

            position: absolute;

            pointer-events: none;

            object-fit: fill;

        }

    </style>


    <!-- face-api.js PRIMERO -->

    <script defer src="./face-api.js"></script>


    <!-- script.js DESPUÉS -->

    <script defer src="./script.js"></script>

</head>


<body>


    <div class="container">


        <video
            id="video"
            width="768"
            height="576"
            autoplay
            muted
            playsinline
            src="./video.mp4">
        </video>


        <div
            id="overlay-elements">
        </div>


    </div>


</body>

</html>
