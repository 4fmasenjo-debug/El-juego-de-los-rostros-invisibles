<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>El juego de los rostros invisibles</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }

        body {

            display: flex;

            justify-content: center;
            align-items: center;

            min-height: 100vh;

            background: #222;

            overflow: hidden;

        }

        .container {

            position: relative;

            width: 768px;
            height: 576px;

        }

        #video {

            position: absolute;

            left: 0;
            top: 0;

            width: 768px;
            height: 576px;

            z-index: 1;

        }

        #overlay-elements {

            position: absolute;

            left: 0;
            top: 0;

            width: 768px;
            height: 576px;

            z-index: 50;

            pointer-events: none;

            overflow: hidden;

        }

        #overlay-elements canvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 768px;
            height: 576px;

            z-index: 60;

            pointer-events: none;

        }

        #overlay-elements img {

            position: absolute;

            z-index: 200;

            pointer-events: none;

            user-select: none;

        }

    </style>

    <script defer src="./face-api.js"></script>

    <script defer src="./script.js?v=999999"></script>

</head>


<body>

    <div class="container">

        <video
            id="video"
            width="768"
            height="576"
            autoplay
            muted
            playsinline
            src="./video.mp4">
        </video>

        <div id="overlay-elements"></div>

    </div>

</body>

</html>
