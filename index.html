<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Rostros con Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            position: relative;
        }
        video {
            display: block;
            width: 720px;
            height: 560px;
        }
        .overlay-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .overlay-elements canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .overlay-elements img {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script defer src="face-api.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <video id="video" width="720" height="560" autoplay muted loop controls src="video.mp4"></video>
        <div id="overlay-elements" class="overlay-elements"></div>
    </div>
</body>
</html>
