<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El juego de los rostros invisibles</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            background: #f0f0f0;

            overflow: hidden;

        }


        .container {

            position: relative;

            width: 768px;

            height: 576px;

            flex-shrink: 0;

        }


        #video {

            position: absolute;

            top: 0;
            left: 0;

            width: 768px;
            height: 576px;

            display: block;

            object-fit: fill;

            z-index: 1;

        }


        #overlay-elements {

            position: absolute;

            top: 0;
            left: 0;

            width: 768px;
            height: 576px;

            z-index: 5;

            pointer-events: none;

        }


        #overlay-elements canvas {

            position: absolute;

            top: 0;
            left: 0;

            width: 768px;
            height: 576px;

            pointer-events: none;

        }


        #overlay-elements img {

            position: absolute;

            pointer-events: none;

            user-select: none;

        }

    </style>


    <!-- =====================================================
         FACE-API.JS
         ===================================================== -->

    <script
        defer
        src="./face-api.js">
    </script>


    <!-- =====================================================
         NUESTRO JAVASCRIPT
         ===================================================== -->

    <script
        defer
        src="./script.js">
    </script>


</head>


<body>


    <div class="container">


        <video
            id="video"
            width="768"
            height="576"
            autoplay
            muted
            playsinline
            src="./video.mp4">
        </video>


        <div
            id="overlay-elements">
        </div>


    </div>


</body>

</html>
