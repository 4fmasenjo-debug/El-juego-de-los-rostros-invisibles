<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Juego de los rostros invisibles</title>

<script defer src="face-api.js"></script>

<style>

#contenedor {
    position: relative;
    width: 768px;
    height: 576px;
}

#video {
    position: absolute;
    top:0;
    left:0;
}

#canvas {
    position: absolute;
    top:0;
    left:0;
}

</style>

</head>


<body>


<div id="contenedor">

    <video 
        id="video"
        autoplay
        muted
        playsinline
        width="768"
        height="576">
    </video>


    <canvas id="canvas"></canvas>

</div>


<script src="script.js"></script>


</body>

</html>
